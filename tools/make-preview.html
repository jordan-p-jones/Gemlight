<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gemlight — preview image generator</title>
<style>
  body{margin:0;padding:28px;background:#0e1622;color:#e9f1f9;
    font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}
  h1{font-size:22px;margin:0 0 4px}
  p{color:#93a7bd;font-size:14px;margin:0 0 22px;max-width:640px;line-height:1.5}
  .wrap{position:relative;max-width:760px;border-radius:16px;overflow:hidden;border:1px solid rgba(143,184,221,.22)}
  .wrap canvas{display:block;width:100%;height:auto}
  .safe{position:absolute;top:0;bottom:0;left:23.75%;width:52.5%;border:2px dashed rgba(233,180,91,.75);pointer-events:none}
  .safe span{position:absolute;top:6px;left:8px;font-size:11px;color:#e9b45b;letter-spacing:.08em}
  .row{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;margin-top:24px}
  .box{text-align:center}
  .box canvas{display:block;border-radius:14px;border:1px solid rgba(143,184,221,.22)}
  .box small{display:block;color:#93a7bd;margin-top:8px;font-size:12px}
  button{margin-top:12px;padding:11px 20px;border-radius:999px;border:0;cursor:pointer;
    font:inherit;font-weight:700;font-size:14px;color:#0e1622;background:linear-gradient(135deg,#8fb8dd,#d3e5f5)}
  button:active{transform:scale(.96)}
</style>
</head>
<body>
<h1>✦ Gemlight preview generator</h1>
<p>The dashed box is the square Messages crops to. Everything important sits inside it, so the thumbnail reads “Gemlight” instead of “eml”. Download both files and drop them in your repo root.</p>

<div class="wrap"><canvas id="og"></canvas><div class="safe"><span>SQUARE CROP SAFE ZONE</span></div></div>
<button id="dlOg">Download og.png (1200×630)</button>

<div class="row">
  <div class="box"><canvas id="sq" width="300" height="300"></canvas><small>What Messages shows</small></div>
  <div class="box"><canvas id="ic" width="180" height="180"></canvas><small>apple-touch-icon.png</small>
    <button id="dlIc">Download icon</button></div>
</div>

<script>
const W=1200,H=630;
const og=document.getElementById('og'); og.width=W; og.height=H;
const c=og.getContext('2d');
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>{const x=hx(a),y=hx(b);return `rgb(${x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')})`;};
const rgba=(h,a)=>{const k=hx(h);return `rgba(${k[0]},${k[1]},${k[2]},${a})`;};
const FONT='ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif';

function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function shape(g,kind,cx,cy,R){
  g.beginPath();
  if(kind==='circle'){g.arc(cx,cy,R,0,7);}
  else if(kind==='heart'){
    g.moveTo(cx,cy+R*.78);
    g.bezierCurveTo(cx-R*1.12,cy+R*.02,cx-R*.74,cy-R*.86,cx,cy-R*.24);
    g.bezierCurveTo(cx+R*.74,cy-R*.86,cx+R*1.12,cy+R*.02,cx,cy+R*.78);
  } else {
    for(let i=0;i<6;i++){const a=-Math.PI/2+i*Math.PI/3;
      i?g.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a)):g.moveTo(cx+R*Math.cos(a),cy+R*Math.sin(a));}
    g.closePath();
  }
}
function jewel(g,kind,cx,cy,R,col,alpha){
  g.save(); g.globalAlpha=alpha;
  const gr=g.createRadialGradient(cx-R*.35,cy-R*.4,R*.08,cx,cy,R*1.05);
  gr.addColorStop(0,mix(col,'#ffffff',.6)); gr.addColorStop(.45,col); gr.addColorStop(1,mix(col,'#000000',.38));
  g.shadowColor=rgba(col,.6); g.shadowBlur=R*.55;
  shape(g,kind,cx,cy,R); g.fillStyle=gr; g.fill(); g.shadowBlur=0;
  shape(g,kind,cx,cy,R); g.strokeStyle=mix(col,'#000000',.45);
  g.globalAlpha=alpha*.7; g.lineWidth=Math.max(1,R*.07); g.stroke(); g.globalAlpha=alpha;
  g.save(); g.translate(cx,cy); g.scale(.58,.58); g.translate(-cx,-cy);
  shape(g,kind,cx,cy,R); g.fillStyle='rgba(255,255,255,.10)'; g.fill();
  g.strokeStyle='rgba(255,255,255,.32)'; g.lineWidth=Math.max(1,R*.055); g.stroke(); g.restore();
  g.save(); g.translate(cx-R*.3,cy-R*.38); g.rotate(-.5);
  g.beginPath(); g.ellipse(0,0,R*.22,R*.11,0,0,7); g.fillStyle='rgba(255,255,255,.55)'; g.fill(); g.restore();
  g.restore();
}
function sparkle(g,x,y,s,col,alpha){
  g.save(); g.globalAlpha=alpha; g.fillStyle=col; g.beginPath();
  g.moveTo(x,y-s); g.quadraticCurveTo(x+s*.18,y-s*.18,x+s,y);
  g.quadraticCurveTo(x+s*.18,y+s*.18,x,y+s);
  g.quadraticCurveTo(x-s*.18,y+s*.18,x-s,y);
  g.quadraticCurveTo(x-s*.18,y-s*.18,x,y-s);
  g.closePath(); g.fill(); g.restore();
}
function glow(g,cx,cy,r,col,a){
  const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);
  gr.addColorStop(0,rgba(col,a)); gr.addColorStop(1,rgba(col,0));
  g.fillStyle=gr; g.fillRect(0,0,W,H);
}

function render(){
  const bg=c.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0e1622'); bg.addColorStop(.52,'#172536'); bg.addColorStop(1,'#1f3349');
  c.fillStyle=bg; c.fillRect(0,0,W,H);
  c.globalCompositeOperation='lighter';
  glow(c,180,90,520,'#8fb8dd',.20);
  glow(c,1050,560,480,'#b58cf0',.13);
  glow(c,600,640,520,'#5fd2c8',.08);
  c.globalCompositeOperation='source-over';

  jewel(c,'circle',110,175,72,'#e2637e',.16);
  jewel(c,'hexagon',1092,468,84,'#57b0f2',.15);
  jewel(c,'heart',158,528,58,'#f28bb8',.12);
  sparkle(c,1030,120,20,'#d3e5f5',.35);
  sparkle(c,250,420,13,'#8fb8dd',.30);
  sparkle(c,940,300,10,'#d3e5f5',.22);

  jewel(c,'circle',474,268,56,'#e2637e',1);
  jewel(c,'hexagon',726,268,56,'#57b0f2',1);
  jewel(c,'heart',600,242,82,'#f28bb8',1);
  sparkle(c,700,152,17,'#d3e5f5',.9);
  sparkle(c,506,166,11,'#d3e5f5',.6);

  c.textAlign='center'; c.textBaseline='middle';
  c.fillStyle='#e9f1f9';
  c.font='800 104px '+FONT;
  c.shadowColor='rgba(143,184,221,.45)'; c.shadowBlur=32;
  c.fillText('Gemlight',600,418);
  c.shadowBlur=0;
  c.font='500 34px '+FONT; c.fillStyle='#93a7bd';

  document.getElementById('sq').getContext('2d').drawImage(og,(W-H)/2,0,H,H,0,0,300,300);
}

function renderIcon(){
  const ic=document.getElementById('ic'), g=ic.getContext('2d');
  const bg=g.createLinearGradient(0,0,180,180);
  bg.addColorStop(0,'#1f3349'); bg.addColorStop(1,'#0e1622');
  rr(g,0,0,180,180,40); g.fillStyle=bg; g.fill();
  jewel(g,'heart',90,96,50,'#f28bb8',1);
  sparkle(g,140,44,15,'#d3e5f5',.95);
  sparkle(g,40,140,9,'#8fb8dd',.7);
}
function dl(canvas,name){
  canvas.toBlob(b=>{
    const u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
  },'image/png');
}
render(); renderIcon();
document.getElementById('dlOg').onclick=()=>dl(og,'og.png');
document.getElementById('dlIc').onclick=()=>dl(document.getElementById('ic'),'apple-touch-icon.png');
</script>
</body>
</html>
